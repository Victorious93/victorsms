name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: victorsms-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: victorsms-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: victorsms-debug-x86_64
          path: app/build/outputs/apk/debug/*-x86_64-debug.apk
          if-no-files-found: error
